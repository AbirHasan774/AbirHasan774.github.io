<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abir Hasan | Website Designer</title>
<style>
:root{
  --bg:#0A0A0A;
  --text:#F2F2F2;
  --muted:#9A9A9A;
  --accent:#E10600;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:900px;margin:0 auto}
.tag{color:var(--accent);letter-spacing:2px;font-size:.85rem;text-transform:uppercase;margin-bottom:16px}
h1{font-size:clamp(2rem,8vw,4rem);line-height:1.1;margin-bottom:20px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:clamp(1rem,4vw,1.25rem);line-height:1.6;max-width:560px;margin-bottom:32px}
.btn{display:inline-block;align-self:flex-start;background:var(--accent);color:#fff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:bold;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.hero>*{animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<section class="hero">
  <!-- CHANGE HERE: tomar naam / title -->
  <p class="tag">Abir Hasan</p>

  <!-- CHANGE HERE: main headline (lal part ta span er bhitore) -->
  <h1>I turn your ideas into <span>real websites.</span></h1>

  <!-- CHANGE HERE: choto description -->
  <p class="sub">Modern, mobile-friendly and premium dark-style websites for your business.</p>

  <!-- CHANGE HERE: button er lekha -->
  <a class="btn" href="#contact">Contact me</a>
</section>

</body>
</html>
